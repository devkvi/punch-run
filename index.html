<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-ogp-key" content="6412171f-891d-4193-8761-26a874429aff" id="ogp-key-meta" />
<title>Punch Run 🐒</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a0e2e;
  overflow: hidden;
  font-family: 'Fredoka', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#gameWrapper {
  position: relative;
  width: 800px;
  height: 500px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(255, 150, 50, 0.3), 0 8px 32px rgba(0,0,0,0.5);
  border: 3px solid rgba(255, 180, 80, 0.4);
  transform-origin: top center;
}

canvas {
  display: block;
  width: 800px;
  height: 500px;
}

@media (max-width: 820px) {
  body {
    justify-content: flex-start;
    padding-top: 10px;
    overflow: auto;
  }
  #gameWrapper {
    transform: scale(var(--game-scale, 1));
    margin-bottom: calc((var(--game-scale, 1) - 1) * 500px);
  }
  #controls { display: none; }
}

#ui {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
  z-index: 10;
}

.score-display {
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
  padding: 6px 16px;
  border-radius: 20px;
  color: #ffd54f;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  border: 2px solid rgba(255, 213, 79, 0.3);
}

#controls {
  color: rgba(255,255,255,0.5);
  font-size: 13px;
  margin-top: 10px;
  letter-spacing: 1px;
}

#controls span {
  background: rgba(255,255,255,0.1);
  padding: 3px 10px;
  border-radius: 6px;
  margin: 0 3px;
  border: 1px solid rgba(255,255,255,0.15);
}

#overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 20;
  color: white;
  cursor: pointer;
}

#overlay h2 {
  font-size: 36px;
  color: #ffd54f;
  margin-bottom: 8px;
}

#overlay p {
  font-size: 16px;
  opacity: 0.7;
  margin-bottom: 4px;
}

#overlay .final-score {
  font-size: 24px;
  color: #ff8a65;
  margin: 10px 0;
}

.hidden { display: none !important; }

#soundToggle {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 25;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
  border: 2px solid rgba(255, 213, 79, 0.3);
  color: #ffd54f;
  font-size: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Fredoka', sans-serif;
}
#soundToggle:hover { background: rgba(0,0,0,0.7); }
</style>
</head>

<script>
// ==================== AUDIO ENGINE ====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let soundEnabled = true;
let musicGain = null;
let sfxGain = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new AudioCtx();
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.15;
  musicGain.connect(audioCtx.destination);
  sfxGain = audioCtx.createGain();
  sfxGain.gain.value = 0.3;
  sfxGain.connect(audioCtx.destination);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
  if (musicGain) musicGain.gain.value = soundEnabled ? 0.15 : 0;
  if (sfxGain) sfxGain.gain.value = soundEnabled ? 0.3 : 0;
}

// Cute cozy melody using pentatonic scale
const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

let musicInterval = null;
let noteIndex = 0;
// A little looping melody pattern (indices into PENTATONIC)
const MELODY = [0,2,4,5,4,2,3,4,5,4,3,2,0,1,2,3,2,1,0,2,4,5,7,5,4,3,2,0,1,3,2,0];

function playMusic() {
  if (musicInterval) return;
  noteIndex = 0;
  musicInterval = setInterval(() => {
    if (!audioCtx || !soundEnabled) return;
    const freq = PENTATONIC[MELODY[noteIndex % MELODY.length]];
    noteIndex++;
    
    // Soft sine + triangle layered for cozy sound
    const osc1 = audioCtx.createOscillator();
    osc1.type = 'sine';
    osc1.frequency.value = freq;
    
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.value = freq * 2; // octave up, quieter
    
    const g1 = audioCtx.createGain();
    g1.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    
    const g2 = audioCtx.createGain();
    g2.gain.setValueAtTime(0.04, audioCtx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    
    osc1.connect(g1).connect(musicGain);
    osc2.connect(g2).connect(musicGain);
    
    osc1.start();
    osc2.start();
    osc1.stop(audioCtx.currentTime + 0.45);
    osc2.stop(audioCtx.currentTime + 0.35);
  }, 280);
}

function stopMusic() {
  if (musicInterval) {
    clearInterval(musicInterval);
    musicInterval = null;
  }
}

function playSfx(type) {
  if (!audioCtx || !soundEnabled) return;
  const now = audioCtx.currentTime;
  
  if (type === 'jump') {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(350, now);
    osc.frequency.exponentialRampToValueAtTime(700, now + 0.12);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(g).connect(sfxGain);
    osc.start(now);
    osc.stop(now + 0.15);
  }
  else if (type === 'double_jump') {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, now);
    osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(g).connect(sfxGain);
    osc.start(now);
    osc.stop(now + 0.12);
    // sparkle
    setTimeout(() => {
      if (!audioCtx) return;
      const o2 = audioCtx.createOscillator();
      o2.type = 'triangle';
      o2.frequency.value = 1200;
      const g2 = audioCtx.createGain();
      g2.gain.setValueAtTime(0.1, audioCtx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      o2.connect(g2).connect(sfxGain);
      o2.start();
      o2.stop(audioCtx.currentTime + 0.08);
    }, 60);
  }
  else if (type === 'collect') {
    // Happy ding
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.setValueAtTime(1100, now + 0.06);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.connect(g).connect(sfxGain);
    osc.start(now);
    osc.stop(now + 0.2);
  }
  else if (type === 'hit') {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(g).connect(sfxGain);
    osc.start(now);
    osc.stop(now + 0.25);
  }
  else if (type === 'death') {
    [0, 100, 200].forEach((delay, i) => {
      setTimeout(() => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 300 - i * 80;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.2, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.connect(g).connect(sfxGain);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }, delay);
    });
  }
  else if (type === 'land') {
    // Soft thud
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.15, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(g).connect(sfxGain);
    osc.start(now);
    osc.stop(now + 0.1);
  }
}

const images = {};
let loadedCount = 0;
const totalImages = Object.keys(SPRITE_URLS).length;

function loadImages(callback) {
  for (const [key, url] of Object.entries(SPRITE_URLS)) {
    const img = new Image();
    img.onload = () => {
      loadedCount++;
      if (loadedCount === totalImages) callback();
    };
    img.src = url;
    images[key] = img;
  }
}

// ==================== GAME ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 500;

const GRAVITY = 0.55;
const GROUND_Y = 390;
const PLAYER_W = 70;
const PLAYER_H = 70;

let gameRunning = false;
let score = 0;
let distance = 0;
let lives = 3;
let gameSpeed = 4;
let frameCount = 0;

// Keys
const keys = {};
const justPressed = {};

document.addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
  if ((e.code === 'Space' || e.code === 'ArrowUp') && !gameRunning) {
    startGame();
  }
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Player
let player = {};

function resetPlayer() {
  player = {
    x: 120, y: GROUND_Y - PLAYER_H,
    vy: 0, vx: 0,
    onGround: true,
    wasOnGround: true,
    facing: 1,
    animFrame: 0,
    animTimer: 0,
    state: 'idle',
    invincible: 0,
    hitFlash: 0,
    jumpsLeft: 2,    // double jump support
    maxJumps: 2,
    coyoteTime: 0,   // coyote time frames
    jumpBuffered: false,
    squash: 1,        // squash & stretch
    stretch: 1,
  };
}

let platforms = [];
let bananas = [];
let obstacles = [];
let particles = [];
let clouds = [];
let trees = [];

function resetGame() {
  resetPlayer();
  score = 0;
  distance = 0;
  lives = 2;
  gameSpeed = 4;
  frameCount = 0;
  platforms = [];
  bananas = [];
  obstacles = [];
  particles = [];
  clouds = [];
  trees = [];
  
  for (let i = 0; i < 5; i++) {
    spawnPlatform(400 + i * 250);
  }
  for (let i = 0; i < 4; i++) {
    clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 80, w: 60 + Math.random() * 80, speed: 0.3 + Math.random() * 0.5 });
  }
  for (let i = 0; i < 3; i++) {
    trees.push({ x: 100 + Math.random() * 700, scale: 0.5 + Math.random() * 0.5 });
  }
}

function spawnPlatform(x) {
  const y = 210 + Math.random() * 130;
  const w = 90 + Math.random() * 100;
  platforms.push({ x, y, w, h: 16 });
  if (Math.random() < 0.7) {
    bananas.push({ x: x + w/2 - 10, y: y - 30, w: 20, h: 20, collected: false });
  }
}

function spawnObstacle(x) {
  const r = Math.random();
  let type, w, h;
  if (r < 0.35) { type = 'rock'; w = 35; h = 35; }
  else if (r < 0.65) { type = 'spike'; w = 35; h = 35; }
  else if (r < 0.85) { type = 'rock'; w = 45; h = 45; } // big rock
  else { type = 'zookeeper'; w = 28; h = 50; } // tall obstacle
  obstacles.push({ x, y: GROUND_Y - h, w, h, type });
}

function addParticle(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: -Math.random() * 4 - 1,
      life: 25 + Math.random() * 20,
      maxLife: 45,
      color,
      size: 2 + Math.random() * 4
    });
  }
}

function addDustParticle(x, y) {
  for (let i = 0; i < 3; i++) {
    particles.push({
      x: x + (Math.random()-0.5)*10, y,
      vx: (Math.random() - 0.5) * 2,
      vy: -Math.random() * 1.5,
      life: 15 + Math.random() * 10,
      maxLife: 25,
      color: '#c8b894',
      size: 3 + Math.random() * 3
    });
  }
}

function startGame() {
  if (gameRunning) return;
  initAudio();
  gameRunning = true;
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('overlaySubtitle').textContent = 'Help Punch escape the zoo and find a cozy home!';
  resetGame();
  playMusic();
  gameLoop();
}

function endGame() {
  gameRunning = false;
  stopMusic();
  playSfx('death');
  
  // Punch-themed game over messages based on distance
  let msg, title;
  if (distance < 50) {
    title = '🚨 CAUGHT!';
    msg = 'The zookeepers got Punch! She is back in the enclosure...';
  } else if (distance < 150) {
    title = '🚨 SO CLOSE!';
    msg = 'Punch almost made it past the zoo gates!';
  } else if (distance < 300) {
    title = '🏃 GOOD RUN!';
    msg = 'Punch got out of the zoo but got spotted in the city!';
  } else {
    title = '🌟 AMAZING RUN!';
    msg = 'Punch almost found her cozy home! Try again!';
  }
  
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlayMsg').textContent = msg;
  document.getElementById('overlaySubtitle').textContent = 'Tap or press SPACE to try again';
  document.getElementById('finalScore').textContent = `🍌 ${score}  |  📏 ${Math.floor(distance)}m`;
  document.getElementById('finalScore').classList.remove('hidden');
  document.getElementById('overlay').classList.remove('hidden');
  ogp?.endGame();
}

function tryJump() {
  if (player.jumpsLeft > 0) {
    const isDoubleJump = !player.onGround && player.coyoteTime <= 0;
    
    player.vy = isDoubleJump ? -11.5 : -12.5;
    player.onGround = false;
    player.coyoteTime = 0;
    player.jumpsLeft--;
    player.jumpBuffered = false;
    
    // Squash & stretch
    player.squash = 0.7;
    player.stretch = 1.3;
    
    if (isDoubleJump) {
      playSfx('double_jump');
      addParticle(player.x + PLAYER_W/2, player.y + PLAYER_H, '#fff', 4);
    } else {
      playSfx('jump');
      addDustParticle(player.x + PLAYER_W/2, player.y + PLAYER_H);
    }
  }
}

function update() {
  frameCount++;
  gameSpeed = 4 + Math.floor(distance / 120) * 0.6;
  if (gameSpeed > 11) gameSpeed = 11;
  
  // --- PLAYER INPUT ---
  let moving = false;
  if (keys['ArrowLeft'] || keys['KeyA']) {
    player.vx = -5;
    player.facing = -1;
    moving = true;
  } else if (keys['ArrowRight'] || keys['KeyD']) {
    player.vx = 5;
    player.facing = 1;
    moving = true;
  } else {
    player.vx *= 0.8;
    if (Math.abs(player.vx) < 0.5) player.vx = 0;
  }
  
  // Jump with buffering
  const jumpPressed = justPressed['Space'] || justPressed['ArrowUp'] || justPressed['KeyW'];
  if (jumpPressed) {
    if (player.jumpsLeft > 0) {
      tryJump();
    } else {
      player.jumpBuffered = true;
    }
  }
  
  // Clear justPressed
  for (const k in justPressed) justPressed[k] = false;
  
  // --- PHYSICS ---
  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;
  
  // Coyote time countdown
  if (!player.onGround) {
    player.coyoteTime--;
  }
  
  // Bounds
  if (player.x < 0) player.x = 0;
  if (player.x > W - PLAYER_W) player.x = W - PLAYER_W;
  
  // Ground collision
  player.wasOnGround = player.onGround;
  player.onGround = false;
  if (player.y + PLAYER_H >= GROUND_Y) {
    player.y = GROUND_Y - PLAYER_H;
    player.vy = 0;
    player.onGround = true;
  }
  
  // Platform collision (only when falling)
  for (const p of platforms) {
    if (player.vy >= 0 &&
        player.x + PLAYER_W - 5 > p.x && player.x + 5 < p.x + p.w &&
        player.y + PLAYER_H >= p.y && player.y + PLAYER_H <= p.y + p.h + player.vy + 2) {
      player.y = p.y - PLAYER_H;
      player.vy = 0;
      player.onGround = true;
    }
  }
  
  // Landing effects
  if (player.onGround && !player.wasOnGround) {
    player.jumpsLeft = player.maxJumps;
    player.squash = 1.3;
    player.stretch = 0.7;
    playSfx('land');
    addDustParticle(player.x + PLAYER_W/2, player.y + PLAYER_H);
    // Execute buffered jump
    if (player.jumpBuffered) {
      tryJump();
    }
  }
  
  // Reset jumps & coyote time when on ground
  if (player.onGround) {
    player.jumpsLeft = player.maxJumps;
    player.coyoteTime = 6; // 6 frames of coyote time
  }
  
  // Squash & stretch lerp back
  player.squash += (1 - player.squash) * 0.15;
  player.stretch += (1 - player.stretch) * 0.15;
  
  // State
  if (!player.onGround) {
    player.state = player.vy < 0 ? 'jump' : 'fall';
  } else if (Math.abs(player.vx) > 1 || moving) {
    player.state = 'run';
  } else {
    player.state = 'idle';
  }
  
  // Animation
  player.animTimer++;
  if (player.animTimer > 7) {
    player.animTimer = 0;
    player.animFrame = (player.animFrame + 1) % 3;
  }
  
  // --- SCROLL WORLD ---
  distance += gameSpeed * 0.02;
  
  for (const p of platforms) p.x -= gameSpeed;
  for (const b of bananas) b.x -= gameSpeed;
  for (const o of obstacles) o.x -= gameSpeed;
  for (const c of clouds) c.x -= c.speed;
  for (const t of trees) t.x -= gameSpeed * 0.3;
  
  platforms = platforms.filter(p => p.x + p.w > -50);
  bananas = bananas.filter(b => b.x > -50 && !b.collected);
  obstacles = obstacles.filter(o => o.x > -50);
  
  if (platforms.length < 5) {
    const lastX = platforms.length > 0 ? Math.max(...platforms.map(p => p.x)) : W;
    spawnPlatform(lastX + 180 + Math.random() * 150);
  }
  
  if (frameCount % Math.max(30, 80 - Math.floor(distance * 0.8)) === 0 && Math.random() < 0.7) {
    spawnObstacle(W + 50);
    // After 100m, sometimes spawn double obstacles
    if (distance > 100 && Math.random() < 0.3) {
      spawnObstacle(W + 130);
    }
  }
  
  if (frameCount % 70 === 0 && Math.random() < 0.4) {
    bananas.push({ x: W + 50, y: GROUND_Y - 45 - Math.random() * 30, w: 20, h: 20, collected: false });
  }
  
  clouds = clouds.filter(c => c.x + c.w > -10);
  if (clouds.length < 4) {
    clouds.push({ x: W + 20, y: 30 + Math.random() * 80, w: 60 + Math.random() * 80, speed: 0.3 + Math.random() * 0.5 });
  }
  trees = trees.filter(t => t.x > -60);
  if (trees.length < 3) {
    trees.push({ x: W + 30 + Math.random() * 100, scale: 0.5 + Math.random() * 0.5 });
  }
  
  // --- COLLISIONS ---
  for (const b of bananas) {
    if (!b.collected &&
        player.x + PLAYER_W - 5 > b.x && player.x + 5 < b.x + b.w &&
        player.y + PLAYER_H - 5 > b.y && player.y + 5 < b.y + b.h) {
      b.collected = true;
      score++;
      ogp?.addPoints(1);
      playSfx('collect');
      addParticle(b.x + 10, b.y + 10, '#ffd54f', 8);
    }
  }
  
  if (player.invincible <= 0) {
    for (const o of obstacles) {
      const m = 12;
      if (player.x + PLAYER_W - m > o.x && player.x + m < o.x + o.w &&
          player.y + PLAYER_H - m > o.y && player.y + m < o.y + o.h) {
        lives--;
        player.invincible = 90;
        player.hitFlash = 20;
        playSfx('hit');
        addParticle(player.x + PLAYER_W/2, player.y + PLAYER_H/2, '#ff5252', 10);
        if (lives <= 0) { endGame(); return; }
      }
    }
  } else {
    player.invincible--;
  }
  if (player.hitFlash > 0) player.hitFlash--;
  
  // Particles
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.12;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
  
  // Running dust
  if (player.state === 'run' && frameCount % 12 === 0) {
    addDustParticle(player.x + (player.facing === 1 ? 10 : PLAYER_W - 10), player.y + PLAYER_H);
  }
  
  // UI
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('livesVal').textContent = lives;
  document.getElementById('distVal').textContent = Math.floor(distance);
}

function draw() {
  // Sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#87CEEB');
  skyGrad.addColorStop(0.5, '#b8e6f0');
  skyGrad.addColorStop(1, '#a8d8a0');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  
  // Sun with glow
  ctx.save();
  ctx.beginPath();
  ctx.arc(680, 70, 50, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 244, 194, 0.3)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(680, 70, 35, 0, Math.PI * 2);
  ctx.fillStyle = '#fff4c2';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(680, 70, 28, 0, Math.PI * 2);
  ctx.fillStyle = '#ffe082';
  ctx.fill();
  ctx.restore();
  
  // Clouds
  for (const c of clouds) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w/2, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x - c.w*0.22, c.y - 9, c.w*0.3, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w*0.22, c.y - 6, c.w*0.25, 11, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Background trees
  for (const t of trees) {
    const s = t.scale;
    ctx.fillStyle = '#6b9e6d';
    ctx.beginPath();
    ctx.ellipse(t.x, GROUND_Y - 40 * s, 22 * s, 35 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5a8c5c';
    ctx.fillRect(t.x - 3 * s, GROUND_Y - 10 * s, 6 * s, 12 * s);
  }
  
  // Background hills
  ctx.fillStyle = '#7cb87f';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  for (let x = 0; x <= W; x += 40) {
    ctx.lineTo(x, GROUND_Y - 15 - Math.sin(x * 0.008 + distance * 0.01) * 25);
  }
  ctx.lineTo(W, GROUND_Y);
  ctx.fill();
  
  // Ground
  ctx.fillStyle = '#5d9e5f';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#4a8a4c';
  ctx.fillRect(0, GROUND_Y, W, 4);
  
  // Ground pattern
  ctx.fillStyle = '#528e54';
  for (let x = -((Math.floor(distance * 20) % 40)); x < W; x += 40) {
    ctx.fillRect(x, GROUND_Y + 8, 20, 3);
  }
  
  // Grass tufts
  ctx.fillStyle = '#6db86f';
  for (let x = 0; x < W; x += 25) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y);
    ctx.lineTo(x + 3, GROUND_Y - 7);
    ctx.lineTo(x + 6, GROUND_Y);
    ctx.fill();
  }
  
  // Platforms
  for (const p of platforms) {
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(p.x + 4, p.y + 4, p.w, p.h);
    
    const pGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
    pGrad.addColorStop(0, '#9d7e53');
    pGrad.addColorStop(1, '#6b5030');
    ctx.fillStyle = pGrad;
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.w, p.h, 5);
    ctx.fill();
    
    // Wood lines
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 1;
    for (let lx = p.x + 15; lx < p.x + p.w - 5; lx += 20) {
      ctx.beginPath();
      ctx.moveTo(lx, p.y + 2);
      ctx.lineTo(lx, p.y + p.h - 2);
      ctx.stroke();
    }
    
    // Grass
    ctx.fillStyle = '#6db86f';
    ctx.beginPath();
    ctx.roundRect(p.x - 2, p.y - 4, p.w + 4, 7, [4, 4, 0, 0]);
    ctx.fill();
  }
  
  // Bananas
  for (const b of bananas) {
    if (b.collected) continue;
    const bob = Math.sin(frameCount * 0.08 + b.x * 0.1) * 3;
    ctx.save();
    ctx.translate(b.x + 10, b.y + 10 + bob);
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 213, 79, 0.25)';
    ctx.fill();
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 5, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffecb3';
    ctx.beginPath();
    ctx.ellipse(-1, -2, 5, 3, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  
  // Obstacles
  for (const o of obstacles) {
    if (o.type === 'rock') {
      ctx.fillStyle = '#78909c';
      ctx.beginPath();
      ctx.moveTo(o.x + 2, o.y + o.h);
      ctx.lineTo(o.x + o.w * 0.3, o.y + 2);
      ctx.lineTo(o.x + o.w * 0.7, o.y);
      ctx.lineTo(o.x + o.w - 2, o.y + o.h);
      ctx.fill();
      ctx.fillStyle = '#90a4ae';
      ctx.beginPath();
      ctx.moveTo(o.x + 6, o.y + o.h);
      ctx.lineTo(o.x + o.w * 0.4, o.y + 5);
      ctx.lineTo(o.x + o.w * 0.6, o.y + o.h);
      ctx.fill();
    } else if (o.type === 'zookeeper') {
      // Zookeeper - tall person shape
      const cx = o.x + o.w/2;
      // Body (khaki uniform)
      ctx.fillStyle = '#c2a66b';
      ctx.fillRect(o.x + 4, o.y + 16, o.w - 8, o.h - 16);
      // Head
      ctx.fillStyle = '#e8c9a0';
      ctx.beginPath();
      ctx.arc(cx, o.y + 10, 10, 0, Math.PI * 2);
      ctx.fill();
      // Hat
      ctx.fillStyle = '#7a6340';
      ctx.fillRect(cx - 12, o.y + 1, 24, 6);
      ctx.fillRect(cx - 8, o.y - 4, 16, 7);
      // Legs
      ctx.fillStyle = '#5d4e37';
      ctx.fillRect(o.x + 6, o.y + o.h - 14, 7, 14);
      ctx.fillRect(o.x + o.w - 13, o.y + o.h - 14, 7, 14);
    } else {
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = '#e53935';
        ctx.beginPath();
        ctx.moveTo(o.x + i * 11, o.y + o.h);
        ctx.lineTo(o.x + i * 11 + 6, o.y + 3);
        ctx.lineTo(o.x + i * 11 + 12, o.y + o.h);
        ctx.fill();
        ctx.fillStyle = '#ef5350';
        ctx.beginPath();
        ctx.moveTo(o.x + i * 11 + 2, o.y + o.h);
        ctx.lineTo(o.x + i * 11 + 6, o.y + 8);
        ctx.lineTo(o.x + i * 11 + 9, o.y + o.h);
        ctx.fill();
      }
    }
  }
  
  // Player
  if (!(player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0)) {
    drawPlayer();
  }
  
  // Particles
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  // Double jump indicator
  if (player.onGround || player.jumpsLeft > 0) {
    const jx = player.x + PLAYER_W / 2;
    const jy = player.y - 12;
    for (let i = 0; i < player.jumpsLeft; i++) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.arc(jx - 6 + i * 12, jy, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawPlayer() {
  let spriteKey;
  const dir = player.facing === 1 ? 'r' : 'l';
  
  switch (player.state) {
    case 'jump':
    case 'fall':
      spriteKey = `jump_${dir}`;
      break;
    case 'run':
      spriteKey = `run_${player.animFrame}_${dir}`;
      break;
    default:
      spriteKey = `run_1_${dir}`;
  }
  
  const img = images[spriteKey];
  if (!img) return;
  
  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#000';
  const shadowY = GROUND_Y + 2;
  ctx.beginPath();
  ctx.ellipse(player.x + PLAYER_W/2, shadowY, 22, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  
  // Draw with squash & stretch
  const sw = (PLAYER_W + 20) * player.squash;
  const sh = (PLAYER_H + 20) * player.stretch;
  const sx = player.x + PLAYER_W/2 - sw/2;
  const sy = player.y + PLAYER_H - sh + 5;
  
  ctx.drawImage(img, sx, sy, sw, sh);
}

function gameLoop() {
  if (!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// Touch controls
let touchActive = false;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!gameRunning) { startGame(); return; }
  touchActive = true;
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const tx = (touch.clientX - rect.left) / rect.width * W;
  const ty = (touch.clientY - rect.top) / rect.height * H;
  
  if (ty < H * 0.5) {
    justPressed['Space'] = true;
    keys['Space'] = true;
  }
  if (tx < W * 0.35) {
    keys['ArrowLeft'] = true;
  } else if (tx > W * 0.65) {
    keys['ArrowRight'] = true;
  } else {
    justPressed['Space'] = true;
    keys['Space'] = true;
  }
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touchActive) return;
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const tx = (touch.clientX - rect.left) / rect.width * W;
  keys['ArrowLeft'] = tx < W * 0.35;
  keys['ArrowRight'] = tx > W * 0.65;
});

canvas.addEventListener('touchend', e => {
  touchActive = false;
  keys['ArrowLeft'] = false;
  keys['ArrowRight'] = false;
  keys['Space'] = false;
});

// ==================== MOBILE SCALING ====================
function scaleGame() {
  const wrapper = document.getElementById('gameWrapper');
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  if (vw < 820) {
    const scale = Math.min(vw / 800, vh / 560);
    wrapper.style.setProperty('--game-scale', scale);
    document.documentElement.style.setProperty('--game-scale', scale);
    wrapper.style.transform = `scale(${scale})`;
    wrapper.style.marginBottom = `${(scale - 1) * 500}px`;
    // Show mobile controls
    document.getElementById('mobileControls').style.display = 'flex';
  } else {
    wrapper.style.transform = '';
    wrapper.style.marginBottom = '';
    document.getElementById('mobileControls').style.display = 'none';
  }
}
scaleGame();
window.addEventListener('resize', scaleGame);

// Mobile button controls
function setupMobileButtons() {
  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');
  const btnJump = document.getElementById('btnJump');

  btnLeft.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowLeft'] = true; }, { passive: false });
  btnLeft.addEventListener('touchend', e => { e.preventDefault(); keys['ArrowLeft'] = false; }, { passive: false });
  btnRight.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowRight'] = true; }, { passive: false });
  btnRight.addEventListener('touchend', e => { e.preventDefault(); keys['ArrowRight'] = false; }, { passive: false });
  btnJump.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!gameRunning) { startGame(); return; }
    justPressed['Space'] = true;
    keys['Space'] = true;
  }, { passive: false });
  btnJump.addEventListener('touchend', e => { e.preventDefault(); keys['Space'] = false; }, { passive: false });
}
setupMobileButtons();

// ==================== PLAY.FUN SDK ====================
let ogp;
function initPlayFunSDK() {
  if (typeof OpenGameSDK === 'undefined') return;
  ogp = new OpenGameSDK({ ui: { usePointsWidget: true } });
  ogp.init({ gameId: '29449240-ce32-4557-89e3-ff2e99a9baf3' });
}

// Init
loadImages(() => {
  resetPlayer();
  draw();
});
</script>
<script src="https://sdk.play.fun" onload="initPlayFunSDK()"></script>
